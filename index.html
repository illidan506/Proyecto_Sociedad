<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sociedad de Jóvenes</title>
    <link rel="stylesheet" href="Estilos_Sociedad.css">
</head>

<body>

    <div class="contenedor">

        <header>
            <h1>Dashboard</h1>
            <p>Sociedad de Jóvenes</p>
        </header>

        <main>

            <section class="tarjetas">

                <div class="tarjeta">
                    <h3>Ingresos</h3>
                    <p>Bs 1.250</p>
                </div>

                <div class="tarjeta">
                    <h3>Gastos</h3>
                    <p>Bs 450</p>
                </div>

                <div class="tarjeta">
                    <h3>Saldo</h3>
                    <p>Bs 800</p>
                </div>

            </section>

            <section class="panel">
                <h2>Resumen</h2>
                <p>Bienvenido al sistema de control de la Sociedad de Jóvenes.</p>

                <button onclick="mostrarMensaje()">
                    Ver información
                </button>

                <p id="mensaje"></p>
            </section>

        </main>

        <footer>
            <p>© 2026 Sociedad de Jóvenes</p>
        </footer>

    </div>

    <script src="Javascript.js"></script>

</body>
</html>
